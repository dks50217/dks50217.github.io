<section class="comment-area">
  <div class="comment-wrapper">
    {% if site.giscus-repo-id and site.giscus-category-id %}
    <script>
      // Build the giscus script so we can hand it the current theme at load time.
      (function() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.setAttribute('data-repo', '{{ site.giscus-repo }}');
        s.setAttribute('data-repo-id', '{{ site.giscus-repo-id }}');
        s.setAttribute('data-category', '{{ site.giscus-category }}');
        s.setAttribute('data-category-id', '{{ site.giscus-category-id }}');
        s.setAttribute('data-mapping', 'pathname');
        s.setAttribute('data-strict', '0');
        s.setAttribute('data-reactions-enabled', '1');
        s.setAttribute('data-emit-metadata', '0');
        s.setAttribute('data-input-position', 'bottom');
        s.setAttribute('data-theme', dark ? 'dark' : 'light');
        s.setAttribute('data-lang', 'zh-TW');
        s.crossOrigin = 'anonymous';
        s.async = true;
        document.currentScript.parentNode.appendChild(s);
      })();
    </script>
    {% endif %}
  </div>
</section> <!-- End Comment Area -->
